name: Build Mayra AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Configure Gemini API Key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          API_KEY="${GEMINI_API_KEY:-$GOOGLE_API_KEY}"

          if [ -z "$API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY secret is missing."
            exit 1
          fi

          echo "GEMINI_API_KEY=$API_KEY" > .env
          echo "GEMINI_API_KEY=$API_KEY" > app/.env
          echo "GEMINI_API_KEY=$API_KEY" >> local.properties

      - name: Build Debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          API_KEY="${GEMINI_API_KEY:-$GOOGLE_API_KEY}"
          ./gradlew assembleDebug -PGEMINI_API_KEY="$API_KEY"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/Mayra-AI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mayra-AI-APK
          path: app/build/outputs/apk/debug/Mayra-AI.apk

      # Create a public GitHub Release only when manually started.
      - name: Read App Version
        id: version
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | \
            sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not find versionName."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Mayra AI version: $VERSION"

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Mayra AI v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/Mayra-AI.apk
