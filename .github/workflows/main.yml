name: Build Mayra AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# Keep only the newest push build so stale commits cannot publish an older APK.
concurrency:
  group: mayra-ai-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Configure OpenAI API Key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "ERROR: OPENAI_API_KEY secret is missing."
            exit 1
          fi

          echo "OPENAI_API_KEY=$OPENAI_API_KEY" > .env
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" > app/.env
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> local.properties

      - name: Run Unit Tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ./gradlew testDebugUnitTest \
            -POPENAI_API_KEY="$OPENAI_API_KEY"

      - name: Build Debug APK
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ./gradlew assembleDebug \
            -POPENAI_API_KEY="$OPENAI_API_KEY"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/Mayra-AI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Mayra-AI-APK
          path: app/build/outputs/apk/debug/Mayra-AI.apk
          if-no-files-found: error

      - name: Read App Version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | \
            sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not find versionName in app/build.gradle.kts"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          APK="app/build/outputs/apk/debug/Mayra-AI.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Mayra AI v${VERSION}" \
              --generate-notes
          fi
