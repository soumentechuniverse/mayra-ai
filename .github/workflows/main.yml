name: Build Mayra AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Configure Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          API_KEY="${GEMINI_API_KEY:-$GOOGLE_API_KEY}"
          if [ -n "$API_KEY" ]; then
            echo "Injecting GEMINI_API_KEY into .env and local.properties"
            echo "GEMINI_API_KEY=$API_KEY" > .env
            echo "GEMINI_API_KEY=$API_KEY" > app/.env
            echo "GEMINI_API_KEY=$API_KEY" >> local.properties
          fi

      - name: Build Debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
        run: ./gradlew assembleDebug -PGEMINI_API_KEY="${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mayra-AI-APK
          path: app/build/outputs/apk/debug/*.apk
