name: Build Mayra AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# Keep only the newest push build so stale commits cannot publish an older APK.
concurrency:
  group: mayra-ai-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Prepare release signing
        id: signing
        env:
          MAYRA_SIGNING_KEY_BASE64: ${{ secrets.MAYRA_SIGNING_KEY_BASE64 }}
          MAYRA_KEYSTORE_PASSWORD: ${{ secrets.MAYRA_KEYSTORE_PASSWORD }}
          MAYRA_KEY_ALIAS: ${{ secrets.MAYRA_KEY_ALIAS }}
          MAYRA_KEY_PASSWORD: ${{ secrets.MAYRA_KEY_PASSWORD }}
        run: |
          if [ -n "$MAYRA_SIGNING_KEY_BASE64" ] &&              [ -n "$MAYRA_KEYSTORE_PASSWORD" ] &&              [ -n "$MAYRA_KEY_ALIAS" ] &&              [ -n "$MAYRA_KEY_PASSWORD" ]; then
            echo "$MAYRA_SIGNING_KEY_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/mayra-release.keystore"
            echo "MAYRA_KEYSTORE_PATH=$GITHUB_WORKSPACE/mayra-release.keystore" >> "$GITHUB_ENV"
            echo "MAYRA_KEYSTORE_PASSWORD=$MAYRA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "MAYRA_KEY_ALIAS=$MAYRA_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MAYRA_KEY_PASSWORD=$MAYRA_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Stable release signing is configured."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Stable signing secrets are missing; building a debug APK artifact only."
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        env:
          RELEASE_SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
        run: |
          if [ "$RELEASE_SIGNING_ENABLED" = "true" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk Mayra-AI.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk Mayra-AI.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Mayra-AI-APK
          path: Mayra-AI.apk
          if-no-files-found: error

      - name: Read App Version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | \
            sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not find versionName in app/build.gradle.kts"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          APK="app/build/outputs/apk/debug/Mayra-AI.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Mayra AI v${VERSION}" \
              --generate-notes
          fi
